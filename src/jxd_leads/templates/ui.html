{% macro hidden(csrf,return_to='') %}<input type="hidden" name="operation_id" value="{{operation_id()}}"><input type="hidden" name="csrf" value="{{csrf}}">{% if return_to %}<input type="hidden" name="return_to" value="{{return_to}}">{% endif %}{% endmacro %}
{% macro empty(title,text) %}<div class="empty"><div class="empty-icon" aria-hidden="true">＋</div><h3>{{title}}</h3><p>{{text}}</p></div>{% endmacro %}
{% macro input(label,name,value='',type='text',required=false,placeholder='') %}<label>{{label}}<input name="{{name}}" type="{{type}}" value="{{value}}" {% if required %}required{% endif %} placeholder="{{placeholder}}"></label>{% endmacro %}
